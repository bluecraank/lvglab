[workspace]
resolver = "3"
members = ["crates/model", "crates/spj", "crates/codegen", "crates/ai", "crates/app"]
default-members = ["crates/app"]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/bluecraank/lvglab"
rust-version = "1.85"

[workspace.dependencies]
lvglab-model = { path = "crates/model" }
lvglab-spj = { path = "crates/spj" }
lvglab-codegen = { path = "crates/codegen" }
lvglab-ai = { path = "crates/ai" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
