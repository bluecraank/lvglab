name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  lvgl-compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Export every widget type
        run: cargo run -p lvglab-codegen --example all_widgets -- out/ui
      - name: Compile against LVGL 8.3.11
        run: |
          git clone --depth 1 --branch v8.3.11 https://github.com/lvgl/lvgl.git lvgl
          printf '#ifndef LV_CONF_H\n#define LV_CONF_H\n#define LV_COLOR_DEPTH 16\n#define LV_FONT_MONTSERRAT_20 1\n#endif\n' > lv_conf.h
          for f in $(find out/ui/src -name '*.c'); do
            gcc -std=c99 -Wall -Wextra -Werror -Wno-unused-parameter -fsyntax-only -DLV_CONF_INCLUDE_SIMPLE -I. -Ilvgl -Iout/ui/src "$f"
          done
