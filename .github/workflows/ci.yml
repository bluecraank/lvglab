name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  lvgl-compile-check:
    strategy:
      fail-fast: false
      matrix:
        lvgl: ["8.3.11", "9.2.2", "9.3.0", "9.4.0", "9.5.0", "9.6.0"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Export every widget type
        run: cargo run -p lvglab-codegen --example all_widgets -- out/ui ${{ matrix.lvgl }}
      - name: Compile against LVGL ${{ matrix.lvgl }}
        run: |
          git clone --depth 1 --branch v${{ matrix.lvgl }} https://github.com/lvgl/lvgl.git lvgl
          case "${{ matrix.lvgl }}" in
            8.*)
              printf '#ifndef LV_CONF_H\n#define LV_CONF_H\n#define LV_COLOR_DEPTH 16\n#define LV_FONT_MONTSERRAT_20 1\n#endif\n' > lv_conf.h
              flags="" ;;
            *)
              printf '#ifndef LV_CONF_H\n#define LV_CONF_H\n#define LV_FONT_MONTSERRAT_20 1\n#endif\n' > lv_conf.h
              # Only the native LVGL 9 API: no aliases of renamed functions. LVGL 9.6
              # deprecates lv_list, lv_menu, lv_win and the generic flag functions.
              flags="-DLV_DISABLE_API_MAPPING -DLV_API_MAP_V8_H -DLV_API_MAP_V9_0_H -DLV_API_MAP_V9_1_H -Wno-deprecated-declarations -Ilvgl/include" ;;
          esac
          for f in $(find out/ui/src -name '*.c'); do
            gcc -std=c99 -Wall -Wextra -Werror -Wno-unused-parameter -fsyntax-only -DLV_CONF_INCLUDE_SIMPLE $flags -I. -Ilvgl -Iout/ui/src "$f"
          done

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p lvglab
      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}", "$env:ProgramFiles" -Filter ISCC.exe -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc.FullName /Q /DAppVersion=0.0.0 installer\lvglab.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist
